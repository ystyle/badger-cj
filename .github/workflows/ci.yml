name: CI

# 触发：master / v2 开发分支推送与所有 PR
on:
  push:
    branches: [master, feat/v2-mmap-wal-vlog]
  pull_request:

# 依赖全部来自仓颉中心仓（cjpm.toml 写版本号），无需 checkout 兄弟仓库。
# macOS 单独跑（ci-macos.yml，手动/定时）：公开仓的 macOS runner 偶发「排队即 cancelled」
# （无 runner 分配、无 step），放进必跑矩阵会让整轮 run 结论变成 cancelled。
jobs:
  build-test:
    name: 构建 · 单测（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # 2.0 发布口径以 Linux 为准。Windows 先跑通可见性；失败项逐条登记
    # （见 docs/progress-tracking.md 的「CI 平台矩阵」），不静默忽略。
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装构建依赖（liburing：io_uring 链接）
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      # setup-cangjie 需要从 GitHub Releases 下载 cjv 引导器；该 CDN 偶发 504，
      # 故失败后重试两次（步骤级 continue-on-error + outcome 判断），不改变最终语义。
      - name: Setup Cangjie
        id: setup-cangjie-1
        uses: Zxilly/setup-cangjie@v3
        continue-on-error: true
        with:
          channel: sts
          # auto：从 cjpm.toml 的 cjc-version 读版本（当前 1.2.0，STS 渠道），
          # 避免两处各写一份、升级编译器时漏改一边。
          version: auto
          components: stdx

      - name: Setup Cangjie（重试 1）
        id: setup-cangjie-2
        if: steps.setup-cangjie-1.outcome == 'failure'
        uses: Zxilly/setup-cangjie@v3
        continue-on-error: true
        with:
          channel: sts
          version: auto
          components: stdx

      - name: Setup Cangjie（重试 2）
        if: steps.setup-cangjie-1.outcome == 'failure' && steps.setup-cangjie-2.outcome == 'failure'
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: auto
          components: stdx

      - name: Build
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        shell: bash
        run: cjpm build -j 4

      - name: Unit tests
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        shell: bash
        run: cjpm test -j 4 --no-progress
