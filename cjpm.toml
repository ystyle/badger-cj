[package]
  cjc-version = "1.1.0"
  name = "badgercj"
  organization = ""
  description = "一个可嵌入、持久化且速度很快的基于LSM-Tree的键值 (KV) 数据库"
version = "1.2.1"
  target-dir = ""
  script-dir = ""
  output-type = "static"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  include =["src"]
  license = ["Apache-2.0"]
  authors = ["ystyle"]
  repository = ["https://atomgit.com/ystyle/badger-cj"]

[package.package-configuration."badgercj.examples.perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.skiplist_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.txn_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.txn_perf_long"]
output-type = "executable"

[package.package-configuration."badgercj.examples.raw_write_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.key_compare_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.sstable_write_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.iouring_integration_test"]
output-type = "executable"

[package.package-configuration."badgercj.examples.iouring_batch_test"]
output-type = "executable"

[dependencies]

# Linux 平台特定配置 - 链接 liburing
[target.x86_64-unknown-linux-gnu]
  link-option = "-luring"

[target.aarch64-unknown-linux-gnu]
  link-option = "-luring"
