[profile]
# 依赖 mmap-cj 使用 experimental 的 [[source-set]] 多平台布局，消费侧需同样开启
# （否则 cjpm 忽略其 source-set 配置、按默认 src 查找而报错）
experimental = true

[package]
  cjc-version = "1.1.0"
  name = "badgercj"
  organization = ""
  description = "一个可嵌入、持久化且速度很快的基于LSM-Tree的键值 (KV) 数据库"
  version = "1.6.20"
  target-dir = ""
  script-dir = ""
  output-type = "static"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  include =["src"]
  license = ["Apache-2.0"]
  authors = ["ystyle"]
  repository = ["https://atomgit.com/ystyle/badger-cj"]

[package.package-configuration."badgercj.examples.perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.skiplist_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.txn_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.txn_perf_long"]
output-type = "executable"

[package.package-configuration."badgercj.examples.raw_write_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.txn_scale_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.key_compare_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.sstable_write_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.iouring_integration_test"]
output-type = "executable"

[package.package-configuration."badgercj.examples.iouring_batch_test"]
output-type = "executable"

[package.package-configuration."badgercj.examples.flush_impact_perf"]
output-type = "executable"
compile-option = "--static -O2 -Woff unused"

[package.package-configuration."badgercj.examples.graceful_exit"]
output-type = "executable"
compile-option = "--static -O2 -Woff unused"

[dependencies]
# v2.0 起 WAL/VLog 写路径依赖 mmap-cj（跨平台内存映射封装）。
# ⚠️ mmapcj 尚未发布中心仓：开发期用 path 依赖，发布 v2.0.0 前必须先发 mmapcj
#    （或换成中心仓版本号），否则消费者解析失败。
"mmapcj" = { path = "../mmap-cj" }

# 依赖只能声明**目标仓（中心仓）确实已有**的版本：声明一个只存在于私有预演仓的版本，
# 会让消费者在本包发布后解析失败（中心仓不可覆盖，只能靠再发新版本补救）。
# snappy 1.0.2 / ystyle::crc 1.0.1 是预演仓里没有源码差异的空版本，未发中心仓，
# 故这里声明中心仓已有的 snappy 1.0.1 与 ystyle::crc 1.0.0。
"snappy" = "1.0.1"
"ystyle::crc" = "1.0.0"

# Linux 平台特定配置 - 链接 liburing
[target.x86_64-unknown-linux-gnu]
  link-option = "-luring"

[target.aarch64-unknown-linux-gnu]
  link-option = "-luring"

[package.package-configuration."badgercj.examples.txn_queue_perf"]
output-type = "executable"

[package.package-configuration."badgercj.examples.batch_commit_perf"]
output-type = "executable"
